# =============================================================================
# Tysiąc — konfiguracja kompilacji
#
# Dwa workflow, uruchamiane w Codemagic osobno:
#   ios-testflight — buduje i wysyła do TestFlight,
#   android-apk    — buduje plik APK do wgrania wprost na telefon.
# =============================================================================

workflows:
  # ===========================================================================
  # iOS — kompilacja, podpisanie i wysyłka do TestFlight.
  #
  # Korzysta z integracji "Tysiackey" dodanej w ustawieniach konta Codemagic.
  # Certyfikaty i profile tworzą się same w kroku „Podpisywanie" — nie trzeba
  # niczego generować ręcznie w portalu Apple.
  # ===========================================================================
  ios-testflight:
    name: Tysiąc — iOS TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Tysiackey

    environment:
      vars:
        # Numer aplikacji wpisany wprost, żeby nie trzeba było zakładać grupy zmiennych.
        APP_STORE_APP_ID: "6799311889"
        BUNDLE_ID: "pl.tysiac.gra"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Przygotowanie struktury
        script: |
          node setup.js prepare

      - name: Instalacja zależności
        script: |
          npm install

      - name: Wygenerowanie projektu iOS
        script: |
          npx cap add ios || echo "Projekt iOS już istnieje"
          npx cap sync ios

      - name: Wtyczka łączenia bez sieci
        script: |
          # Skrypt wpinający wtyczkę do Xcode trzymamy TUTAJ, a nie w osobnym pliku.
          # Osobny plik trzeba pamiętać wgrać do repozytorium — i właśnie na tym
          # kompilacja potykała się dwa razy.
          gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          node setup.js ios

          cat > /tmp/wepnij-wtyczke.rb <<'RUBY_KONIEC'
          #!/usr/bin/env ruby
          # =============================================================================
          # Wpina MultipeerPlugin.swift do celu kompilacji w projekcie Xcode.
          #
          # `npx cap add ios` generuje projekt od zera i nic o naszej wtyczce nie wie —
          # samo skopiowanie pliku do katalogu nie wystarczy, Xcode musi mieć go na liście
          # plików źródłowych. Robimy to tutaj, a nie w konfiguracji CI, żeby dało się
          # ten krok poprawić bez grzebania w pliku budowania.
          #
          # Skrypt jest idempotentny: ponowne uruchomienie niczego nie zdubluje.
          # =============================================================================

          require 'xcodeproj'

          PROJECT_PATH = 'ios/App/App.xcodeproj'
          TARGET_NAME  = 'App'
          PLUGIN_FILE  = 'MultipeerPlugin.swift'

          unless File.exist?(PROJECT_PATH)
            abort "Nie znaleziono #{PROJECT_PATH} — uruchom najpierw 'npx cap add ios'."
          end

          project = Xcodeproj::Project.open(PROJECT_PATH)
          target  = project.targets.find { |t| t.name == TARGET_NAME }
          abort "Nie znaleziono celu '#{TARGET_NAME}' w projekcie." if target.nil?

          already = target.source_build_phase.files_references.any? do |ref|
            ref && ref.path.to_s.include?('MultipeerPlugin')
          end

          if already
            puts "#{PLUGIN_FILE} jest już w celu kompilacji — pomijam."
            exit 0
          end

          unless File.exist?("ios/App/App/#{PLUGIN_FILE}")
            abort "Brak pliku ios/App/App/#{PLUGIN_FILE} — uruchom najpierw 'node setup.js ios'."
          end

          group = project.main_group.find_subpath('App', true)
          ref   = group.new_file(PLUGIN_FILE)
          target.add_file_references([ref])
          project.save

          puts "Dodano #{PLUGIN_FILE} do celu kompilacji."

          RUBY_KONIEC

          ruby /tmp/wepnij-wtyczke.rb

      - name: Numer kompilacji
        script: |
          # Każda wysyłka musi mieć wyższy numer niż poprzednia.
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0) + 1))
          echo "Numer kompilacji: $BUILD_NUMBER"
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"

      - name: Instalacja podów
        script: |
          # Pody instalujemy PRZED podpisywaniem. Odwrotna kolejność kasowała ustawienia
          # certyfikatów wprowadzone przez „use-profiles", przez co Xcode zgłaszał brak
          # profilu przy budowaniu.
          cd ios/App && pod install

      - name: Podpisywanie
        script: |
          set -e

          echo "=== Identyfikator w projekcie Xcode ==="
          # Jeśli tu jest inny identyfikator niż pl.tysiac.gra, profil nigdy nie pasuje.
          grep -m 5 "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj || true
          echo "Oczekiwany: $BUNDLE_ID"

          echo "=== Pobieranie certyfikatów i profili ==="
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --verbose
          keychain add-certificates

          echo "=== Pobrane profile ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "BRAK PROFILI"

          echo "=== Wpisywanie profili do projektu ==="
          xcode-project use-profiles --verbose

          echo "=== Ustawienia podpisywania po zmianie ==="
          grep -m 10 -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" \
            ios/App/App.xcodeproj/project.pbxproj || echo "BRAK USTAWIEŃ PODPISU"

      - name: Budowanie
        script: |
          # Wypisujemy pobrane profile — gdyby coś poszło nie tak, log od razu pokaże,
          # czy podpisywanie w ogóle je przygotowało.
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "Brak profili!"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=DG8Z6X4DNY"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - radoslawgilewski93@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ===========================================================================
  # iOS — SAMA KOMPILACJA, bez podpisywania i bez wysyłki.
  #
  # Nie wymaga konta Apple, klucza API ani certyfikatów. Służy do jednego:
  # sprawdzenia, czy projekt — a zwłaszcza wtyczka MultipeerPlugin.swift —
  # w ogóle się kompiluje. Nie da się tego zainstalować na telefonie.
  #
  # Uruchom to, zanim zaczniesz walczyć z podpisywaniem: jeśli kod się nie
  # kompiluje, żadne certyfikaty tego nie naprawią.
  # ===========================================================================
  ios-sprawdzenie:
    name: Tysiąc — iOS (sprawdzenie kompilacji)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Przygotowanie struktury
        script: |
          node setup.js prepare

      - name: Instalacja zależności
        script: |
          npm install

      - name: Wygenerowanie projektu iOS
        script: |
          npx cap add ios || echo "Projekt iOS już istnieje"
          npx cap sync ios

      - name: Wtyczka łączenia bez sieci
        script: |
          # Skrypt wpinający wtyczkę do Xcode trzymamy TUTAJ, a nie w osobnym pliku.
          # Osobny plik trzeba pamiętać wgrać do repozytorium — i właśnie na tym
          # kompilacja potykała się dwa razy.
          gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          node setup.js ios

          cat > /tmp/wepnij-wtyczke.rb <<'RUBY_KONIEC'
          #!/usr/bin/env ruby
          # =============================================================================
          # Wpina MultipeerPlugin.swift do celu kompilacji w projekcie Xcode.
          #
          # `npx cap add ios` generuje projekt od zera i nic o naszej wtyczce nie wie —
          # samo skopiowanie pliku do katalogu nie wystarczy, Xcode musi mieć go na liście
          # plików źródłowych. Robimy to tutaj, a nie w konfiguracji CI, żeby dało się
          # ten krok poprawić bez grzebania w pliku budowania.
          #
          # Skrypt jest idempotentny: ponowne uruchomienie niczego nie zdubluje.
          # =============================================================================

          require 'xcodeproj'

          PROJECT_PATH = 'ios/App/App.xcodeproj'
          TARGET_NAME  = 'App'
          PLUGIN_FILE  = 'MultipeerPlugin.swift'

          unless File.exist?(PROJECT_PATH)
            abort "Nie znaleziono #{PROJECT_PATH} — uruchom najpierw 'npx cap add ios'."
          end

          project = Xcodeproj::Project.open(PROJECT_PATH)
          target  = project.targets.find { |t| t.name == TARGET_NAME }
          abort "Nie znaleziono celu '#{TARGET_NAME}' w projekcie." if target.nil?

          already = target.source_build_phase.files_references.any? do |ref|
            ref && ref.path.to_s.include?('MultipeerPlugin')
          end

          if already
            puts "#{PLUGIN_FILE} jest już w celu kompilacji — pomijam."
            exit 0
          end

          unless File.exist?("ios/App/App/#{PLUGIN_FILE}")
            abort "Brak pliku ios/App/App/#{PLUGIN_FILE} — uruchom najpierw 'node setup.js ios'."
          end

          group = project.main_group.find_subpath('App', true)
          ref   = group.new_file(PLUGIN_FILE)
          target.add_file_references([ref])
          project.save

          puts "Dodano #{PLUGIN_FILE} do celu kompilacji."

          RUBY_KONIEC

          ruby /tmp/wepnij-wtyczke.rb

      - name: Podpisywanie
        script: |
          set -e

          echo "=== Identyfikator w projekcie Xcode ==="
          # Jeśli tu jest inny identyfikator niż pl.tysiac.gra, profil nigdy nie pasuje.
          grep -m 5 "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj || true
          echo "Oczekiwany: $BUNDLE_ID"

          echo "=== Pobieranie certyfikatów i profili ==="
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --verbose
          keychain add-certificates

          echo "=== Pobrane profile ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "BRAK PROFILI"

          echo "=== Wpisywanie profili do projektu ==="
          xcode-project use-profiles --verbose

          echo "=== Ustawienia podpisywania po zmianie ==="
          grep -m 10 -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" \
            ios/App/App.xcodeproj/project.pbxproj || echo "BRAK USTAWIEŃ PODPISU"

      - name: Kompilacja bez podpisywania
        script: |
          # CODE_SIGNING_ALLOWED=NO pozwala sprawdzić sam kod, bez certyfikatów.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/kompilacja.log
          echo "--- Kompilacja zakończona ---"

    artifacts:
      - /tmp/kompilacja.log
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - radoslawgilewski93@gmail.com

  # ===========================================================================
  # Android — najszybsza droga do sprawdzenia gry na żywo.
  # Nie wymaga konta w sklepie ani recenzji: dostajesz plik APK i instalujesz go
  # bezpośrednio na telefonie.
  # ===========================================================================
  android-apk:
    name: Tysiąc — Android APK (do testów)
    max_build_duration: 30
    # Darmowy plan Codemagic obejmuje maszyny Apple Silicon, a nie linuksowe.
    # Androida buduje się na macOS tak samo dobrze — Java i Gradle są na pokładzie.
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17

    scripts:
      - name: Przygotowanie struktury
        script: |
          node setup.js prepare

      - name: Instalacja zależności
        script: |
          npm install

      - name: Wygenerowanie projektu Android
        script: |
          npx cap add android || echo "Projekt Android już istnieje"
          npx cap sync android

      - name: Wtyczka łączenia bez sieci
        script: |
          node setup.js android

      - name: Budowanie APK
        script: |
          cd android
          chmod +x ./gradlew
          # Wersja debug jest podpisana kluczem testowym, więc instaluje się od razu.
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - radoslawgilewski93@gmail.com   # tu przyjdzie link do gotowego APK
        notify:
          success: true
          failure: true
